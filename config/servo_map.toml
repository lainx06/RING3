# Servo map (D-103, T-16): commanded servo angle -> the arm's angle on the printed gauge, in the vision
# witness only. A least-squares line fitted to the arm angles measured in the six rectified crops of the
# user's zone check zc-20261104-153656 (2026-11-04): the darkness-weighted direction of the black bar 6-20 mm
# from the printed pivot (docs/evidence/T-16/README.md, "Free analysis"; annotated crops in
# docs/evidence/T-16/zc-153656/). Result: gauge = 0.7475 x command + 11.46 deg, worst residual 3.23 deg.
# Integers: gain in parts per million, offset and points in millidegrees. The loader re-fits the points and
# refuses the file if gain/offset differ. The expected zone, the boundary check and the zone-check targets
# use the mapped angle; every witness record logs the commanded and the mapped angle. The SAM backend has
# its own calibration (D-72) and ignores this file. Re-measure after any change to the servo, horn, firmware
# pulse range or paper position.
[servo_map]
gain_ppm = 747500
offset_mdeg = 11458
source_run = "zc-20261104-153656"
evidence = "docs/evidence/T-16/README.md"
measured = "2026-11-04"
method = "darkness-weighted direction of the black bar 6-20 mm from the printed pivot, rectified crop"
points = [[50, 50700], [90, 75900], [130, 109700], [90, 75500], [50, 50000], [130, 110600]]
