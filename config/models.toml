# RING3 model configuration. Read by bridge/ring3bridge/config.py. Never put a key here (MODEL_API_KEY, env only).
#
# Model ID and endpoint: ARCHITECTURE §6 / D-06 (seen in Meta's authenticated catalog on 2026-10-31) and the
# official Responses API docs, https://dev.meta.ai/docs/protocols/responses (D-55, lead, 2026-11-01).
#
# PRICE (D-55): muse-spark-1.3 Standard pricing from Meta's official pricing page,
# https://dev.meta.ai/docs/pricing-rate-limits, checked by the lead on 2026-11-01 (the page carries no date):
# $1.25 / 1M input tokens, $4.25 / 1M output tokens, $0.15 / 1M cached input tokens.
# Units: integer µUSD per 1,000,000 tokens ($1.25 / 1M tokens -> 1250000). The ledger refuses to reserve
# without both prices, price_source and price_checked (fails closed, INV-09).
#
# max_output_tokens bounds reasoning + visible output together (Meta docs; minimum 16), so the ledger reserves
# it in full for every request. 4096 since D-60 (lead, 2026-11-02): in live run 20261102-122431 two replies
# spent all of 2048 reasoning and produced no text. Costs in RING3 are estimates from these prices, not billing.
#
# reasoning_effort (D-61, lead, 2026-11-02): sent as {"reasoning": {"effort": <value>}} in every request. Accepted
# values per the official Responses docs, https://dev.meta.ai/docs/protocols/responses: minimal, low, medium,
# high, xhigh. "none" returns HTTP 400 for Muse Spark and is refused at load, as is anything else. Replies
# showed the default behaving as high (live runs 20261102-122431 and 20261102-124918).

[model]
id = "muse-spark-1.3"
endpoint = "https://api.meta.ai/v1/responses"
max_output_tokens = 4096
reasoning_effort = "low"
timeout_s = 60
price_input_uusd_per_mtok = 1250000
price_output_uusd_per_mtok = 4250000
price_cached_input_uusd_per_mtok = 150000
price_source = "https://dev.meta.ai/docs/pricing-rate-limits"
price_checked = "2026-11-01"

# SAM 3.1 for the camera witness (T-07, D-56). Facts from the official docs, checked by the lead on 2026-11-02:
# https://dev.meta.ai/docs/sam/segmenting and https://dev.meta.ai/docs/sam/reading-segmentation (request and
# output grammar), https://dev.meta.ai/docs/pricing-rate-limits (price). Read by bridge/ring3bridge/witness/sam.py.
# PRICE: $2.50 per 1,000 images = 2500 µUSD per image (integer). One image is reserved before every SAM call.
[sam]
id = "sam-3.1"
endpoint = "https://api.meta.ai/v1/responses"
timeout_s = 60
price_uusd_per_image = 2500
price_source = "https://dev.meta.ai/docs/pricing-rate-limits"
price_checked = "2026-11-02"

# Vision witness (T-16, D-98): Muse Spark reads the printed gauge ZONE from the rectified dial crop. Facts from
# the official docs, checked by the builder on 2026-11-04: image understanding
# (https://dev.meta.ai/docs/image-understanding: Responses API, a user message with an input_text and an
# input_image whose image_url is a base64 data URL; image/jpeg accepted; a ~1280 px image adds roughly
# 1,300-1,500 input tokens, a short text request ~110), structured output
# (https://dev.meta.ai/docs/structured-output and the Responses schemas page: text.format = json_schema with
# name, schema, strict) and the same prices as [model] (https://dev.meta.ai/docs/pricing-rate-limits, re-read
# 2026-11-04: $1.25 / 1M in, $4.25 / 1M out, $0.15 / 1M cached in). A test keeps these prices equal to
# [model]'s while the ids match.
# image_tokens_reserve: input tokens reserved per image before every call, a ceiling over the docs' figure
# (the crop is 920 x 570 px, under 1280); the reservation adds 1 token per request byte outside the image
# and max_output_tokens, and settles on the reported usage. The token-counting page says per-image
# estimates are not portable across deployments: the first live replies' usage.input_tokens are the check.
[vision]
id = "muse-spark-1.3"
endpoint = "https://api.meta.ai/v1/responses"
max_output_tokens = 2048
reasoning_effort = "low"
timeout_s = 60
image_tokens_reserve = 2000
price_input_uusd_per_mtok = 1250000
price_output_uusd_per_mtok = 4250000
price_cached_input_uusd_per_mtok = 150000
price_source = "https://dev.meta.ai/docs/pricing-rate-limits"
price_checked = "2026-11-04"

# Muse Voice Transcribe for push-to-talk requests (T-19, D-104). Facts from the official docs, checked by the
# builder on 2026-11-04: https://dev.meta.ai/docs/api-reference/voice/transcribe,
# https://dev.meta.ai/docs/api-reference/voice/schemas, https://dev.meta.ai/docs/speech-to-text (request shape)
# and https://dev.meta.ai/docs/pricing-rate-limits (price). Read by bridge/ring3bridge/models/transcribe.py.
# PRICE: $0.18 per hour of audio = 180000 µUSD per hour = 50 µUSD per second, metered in whole seconds rounded
# down. The recording's duration, rounded up and capped at 15 s, is reserved before every call.
[voice]
id = "muse-voice-transcribe-1.0"
endpoint = "https://api.meta.ai/v1/asr/transcribe"
timeout_s = 60
price_uusd_per_hour = 180000
price_source = "https://dev.meta.ai/docs/pricing-rate-limits"
price_checked = "2026-11-04"
